<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.blog_title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&display=swap">
  <link rel="stylesheet" href="/assets/css/blog.css">
  {% feed_meta %}
  {% if page.math %}
  <script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="wrap inner">
      <a class="site-title" href="/blog/">{{ site.blog_title }}</a>
      <nav class="site-nav">
        <a href="/blog/">Posts</a>
        <a href="/">Main site</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer wrap">
  &copy; {{ site.time | date: "%Y" }} {{ site.title }} &middot;
  <a href="/feed.xml" title="For use in a feed reader">RSS feed</a>
</footer>
</body>
</html>
